<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TickTick Pinned - Options</title>
  <meta name="description" content="TickTick Pinned Options Page" />
  <link rel="icon" type="image/png" href="./../icons/32x32.png" />
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <main>
    <header>
      <img src="./../icons/32x32.png" alt="TickTick Pinned logo" width="32" height="32" />
      <h1>TickTick<sup>📌Pinned</sup></h1>
    </header>

    <form>
      <label for="shortcut">Keyboard Shortcut</label>
      <input type="text" id="shortcut" />
      <div>
        <button type="button" id="update">Update</button>
        <button type="button" id="reset">Reset</button>
      </div>
    </form>

    <footer>
      <p>
        Made with
        <a href="https://github.com/semanticdata/firefox-ticktick-pinned/" target="_blank" rel="noopener" class="heart">
          <img src="./../icons/heart.svg" aria-hidden="true" width="16" height="16" alt="heart-icon" />
        </a> by <a href="https://miguelpimentel.do/" target="_blank" rel="noopener">Miguel Pimentel</a>.
      </p>
    </footer>
  </main>

  <script src="options.js"></script>
</body>

</html>
